name: engineering-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,hf]'
      - run: pytest -q --junitxml=engineering-tests.xml
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-test-receipt
          path: engineering-tests.xml
